# Alembic 설정
# DB 주소는 여기에 쓰지 않는다. migrations/env.py 가 DATABASE_URL 환경변수에서 읽는다.
#
# 자주 쓰는 명령 (프로젝트 루트에서)
#   alembic upgrade head                          최신 스키마 적용
#   alembic revision --autogenerate -m "설명"      모델 변경 후 마이그레이션 생성
#   alembic current                               현재 적용된 버전 확인

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
